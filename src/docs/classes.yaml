paths:
  /classes:
    get:
      tags: [Classes]
      operationId: getAllClasses
      summary: Lấy danh sách lớp học
      description: >-
        Người có quyền CLASS_READ_ALL xem được tất cả các lớp.
        Người có quyền CLASS_READ_OWN chỉ xem được các lớp mình phụ trách hoặc tham gia.
        Nếu trang được yêu cầu vượt quá tổng số trang, data là mảng rỗng.
      parameters:
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [id, name, description, start_date, end_date, mentor_id]
            default: id
        - name: page
          in: query
          description: Số trang, bắt đầu từ 1.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
            default: 1
        - name: limit
          in: query
          description: Số lớp tối đa trên mỗi trang.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - { $ref: "#/components/parameters/SortOrder" }
      responses:
        "200": { $ref: "#/components/responses/ClassList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      tags: [Classes]
      operationId: createClass
      summary: Tạo lớp học
      description: >-
        Cần quyền CLASS_CREATE. Tên lớp phải duy nhất và endDate phải từ startDate trở đi.
        Nếu gửi mentorId, cần thêm quyền CLASS_ASSIGN_MENTOR và người dùng được chỉ định phải tồn tại.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateClassRequest" }
      responses:
        "201": { $ref: "#/components/responses/ClassCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /classes/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Classes]
      operationId: getClassById
      summary: Lấy lớp học theo ID
      description: "Quyền: CLASS_READ_ALL hoặc CLASS_READ_OWN. Cần là mentor, thành viên của lớp hoặc có CLASS_READ_ALL."
      responses:
        "200": { $ref: "#/components/responses/Class" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    put:
      tags: [Classes]
      operationId: updateClass
      summary: Cập nhật lớp học
      description: >-
        Cần quyền CLASS_UPDATE. Chỉ gửi các trường muốn thay đổi.
        Ngày bắt đầu và kết thúc được đối chiếu với dữ liệu hiện tại.
        Nếu gửi mentorId, cần thêm quyền CLASS_ASSIGN_MENTOR và người dùng được chỉ định phải tồn tại.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateClassRequest" }
      responses:
        "200": { $ref: "#/components/responses/Class" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      tags: [Classes]
      operationId: deleteClass
      summary: Xóa lớp học
      description: "Quyền: CLASS_DELETE. Trả về thông tin lớp đã xóa."
      responses:
        "200": { $ref: "#/components/responses/Class" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /classes/{id}/analytics:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Classes]
      operationId: getClassAnalytics
      summary: Lấy thống kê lớp học
      description: >-
        Người có quyền CLASS_READ_ALL xem được mọi lớp.
        Mentor có quyền CLASS_READ_OWN xem được lớp mình phụ trách.
        Kết quả gồm tỷ lệ hoàn thành bài học, tỷ lệ nộp bài tập và điểm trung bình.
      responses:
        "200": { $ref: "#/components/responses/ClassAnalytics" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
